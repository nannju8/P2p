name: Build LocalDrop APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle 8.7 (sans wrapper)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          gradle-home-cache-cleanup: true

      - name: Lancer les tests unitaires (Crypto & Sécurité)
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compiler l'APK Release allégé (R8)
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Compresser l'APK en ZIP ultra-léger
        run: |
          mkdir -p dist
          APK="android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" dist/LocalDrop.apk
          if command -v 7z >/dev/null 2>&1; then
            7z a -tzip -mx=9 dist/LocalDrop-universal.zip ./dist/LocalDrop.apk
          else
            zip -9 -j dist/LocalDrop-universal.zip dist/LocalDrop.apk
          fi
          ls -lh dist/

      - name: Publier le fichier ZIP final
        uses: actions/upload-artifact@v7
        with:
          name: LocalDrop-universal.zip
          path: dist/LocalDrop-universal.zip
          archive: false
          retention-days: 14
